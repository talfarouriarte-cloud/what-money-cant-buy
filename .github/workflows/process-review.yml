# STUB (agent-pipeline).
name: Process Reviewer
on:
  issues:
    types: [labeled]
  # AP-098 (central#279): revisión de proceso POR LOTES. El cron diario es el
  # umbral de tiempo (14 días desde el último lote).  = lote forzado.
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: process-reviewer
  cancel-in-progress: false
jobs:
  call:
    uses: talfarouriarte-cloud/agent-pipeline/.github/workflows/process-review.yml@main
    with:
      runner: ubuntu-latest
      default_branch: develop
      process_max_turns: 60
      timeout_minutes: 20
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      REVIEWER_GITHUB_TOKEN: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
