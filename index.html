<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football beyond money</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C2492F">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>

<style>
/* ============================================================
   FOOTBALL BEYOND MONEY — Stadium redesign
   ============================================================ */

:root {
  /* --- Stadium Paper theme tokens (overridden by [data-theme]) --- */
  --bg: #F5F2EC;
  --bg-card: #FFFFFF;
  --bg-sunken: #EDE9E1;
  --ink: #181C22;
  --ink-soft: #2A2E35;
  --muted: #6F6A61;
  --hair: rgba(24, 28, 34, 0.10);
  --hair-strong: rgba(24, 28, 34, 0.18);
  --accent: #C2492F;       /* terracotta */
  --accent-ink: #FFFFFF;
  --cobalt: #1E40AF;
  --pos: #1F8A5B;
  --neg: #C2492F;
  --amber: #D8A03D;
  --neut: #6F6A61;
  --shadow-card: 0 1px 0 rgba(14,14,14,0.04);
  --pad: 20px;
  --r-card: 14px;
  --r-pill: 999px;

  --font-ui: "Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-display: "Bricolage Grotesque", "Manrope", serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

[data-theme="dark"] {
  --bg: #0B0D10;
  --bg-card: #14181D;
  --bg-sunken: #1A1F25;
  --ink: #F2F0EA;
  --ink-soft: #D9D6CD;
  --muted: #8A8F97;
  --hair: rgba(255, 255, 255, 0.08);
  --hair-strong: rgba(255, 255, 255, 0.16);
  --accent: #F76A4E;
  --accent-ink: #0B0D10;
  --cobalt: #6A8BFF;
  --pos: #4FD08A;
  --neg: #F46A55;
  --neut: #8A8F97;
  --shadow-card: 0 1px 0 rgba(255,255,255,0.03);
}

[data-theme="broadcast"] {
  --bg: #FFFFFF;
  --bg-card: #FFFFFF;
  --bg-sunken: #F4F4F4;
  --ink: #111111;
  --ink-soft: #2E2E2E;
  --muted: #7A7A7A;
  --hair: rgba(0,0,0,0.10);
  --hair-strong: rgba(0,0,0,0.20);
  --accent: #00B36B;
  --cobalt: #0A0A0A;
  --shadow-card: 0 1px 0 rgba(0,0,0,0.04);
}

[data-accent="rust"]     { --accent: #D14F33; }
[data-accent="cobalt"]   { --accent: #1E40AF; }
[data-accent="emerald"]  { --accent: #0E8A55; }
[data-accent="magenta"]  { --accent: #C5277A; }

[data-density="compact"] { --pad: 14px; --r-card: 10px; }

/* --- Base --- */
* { box-sizing: border-box; }
html, body, #root {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body {
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.45;
}

/* --- Typography helpers --- */
.display      { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.02em; line-height: 1.02; }
.eyebrow      { font-family: var(--font-ui); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.mono         { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tabular      { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.kicker       { font-family: var(--font-display); font-weight: 500; }

h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: 600; letter-spacing: -0.02em; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }

/* --- Layout primitives --- */
.shell { max-width: 1320px; margin: 0 auto; padding: 0 20px; }
@media (max-width: 720px) { .shell { padding: 0 14px; } }

.card {
  background: var(--bg-card);
  border: 1px solid var(--hair);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-card);
}
.hair-bot { border-bottom: 1px solid var(--hair); }
.hair-top { border-top: 1px solid var(--hair); }
.hair-r   { border-right: 1px solid var(--hair); }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--r-pill);
  border: 1px solid var(--hair-strong);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.pill.dark   { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pill.ghost  { background: transparent; color: var(--muted); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 10px;
  border-radius: 999px;
  background: var(--bg-sunken);
  color: var(--ink-soft);
  font-size: 12px;
  font-weight: 600;
  border: 1px solid transparent;
  transition: all .12s ease;
  white-space: nowrap;
}
.chip:hover { background: var(--bg-card); border-color: var(--hair-strong); }
.chip.is-active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* --- Big display numbers --- */
.statline { display: flex; align-items: baseline; gap: 8px; }
.bignum   { font-family: var(--font-display); font-weight: 600; font-size: clamp(38px, 6vw, 64px); line-height: 0.95; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.midnum   { font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 3.6vw, 40px); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.smnum    { font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.delta-up   { color: var(--pos); }
.delta-down { color: var(--neg); }

/* --- Table --- */
table.fbm {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}
.fbm th, .fbm td {
  padding: 6px 9px;
  text-align: left;
  border-bottom: 1px solid var(--hair);
  font-size: 12.5px;
  vertical-align: middle;
}
.fbm th {
  font-family: var(--font-ui);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--bg-card);
}
/* whole thead sticks as one block (safe with rowSpan/colSpan headers) */
.fbm thead { position: sticky; top: 0; z-index: 2; background: var(--bg-card); }
.fbm thead th { box-shadow: 0 1px 0 var(--hair); }
.fbm td.num, .fbm th.num { text-align: right; font-family: var(--font-mono); font-size: 12px; }
.fbm tr:hover td { background: var(--bg-sunken); }
.fbm tr.is-sel td { background: rgba(208,79,51,0.08); }
.fbm .rk { width: 30px; color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; }
.fbm .team-cell { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.fbm .badge-col { width: 24px; }

/* scrollable table regions: cap height so sticky headers work while scrolling */
.scrollx { max-height: 76vh; overflow: auto; }

/* Predictions table: full width on desktop, compact fit on phone-landscape */
.predtable { min-width: 900px; }
.predtable .pred-team { min-width: 150px; }
@media (max-width: 1024px) {
  .predtable { min-width: 0; }
  .predtable th, .predtable td { padding: 3px 4px; font-size: 10.5px; }
  .predtable th { font-size: 8px; letter-spacing: 0.04em; }
  .predtable td.num, .predtable th.num { font-size: 10px; }
  .predtable .pred-team { min-width: 0; gap: 5px; }
  .predtable .pred-team span:last-child { font-size: 11px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 76px; }
}

/* --- Form result chips (W/D/L) --- */
.formdot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px; height: 20px;
  border-radius: 5px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--bg);
}
.formdot.w { background: var(--pos); }
.formdot.d { background: var(--amber); }
.formdot.l { background: var(--neg); }

/* --- Group nav (desktop) --- */
.tabstrip {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--bg);
  border-bottom: 1px solid var(--hair);
  backdrop-filter: blur(8px);
}
.tabstrip-inner {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabstrip-inner::-webkit-scrollbar { display: none; }
.tabbtn {
  position: relative;
  flex: 0 0 auto;
  padding: 14px 14px 12px;
  background: transparent;
  border: none;
  color: var(--muted);
  font-weight: 600;
  font-size: 13.5px;
  letter-spacing: -0.005em;
  white-space: nowrap;
}
.tabbtn::after {
  content: "";
  position: absolute;
  left: 14px; right: 14px;
  bottom: -1px;
  height: 2px;
  background: transparent;
  transition: background .15s ease;
}
.tabbtn.is-active { color: var(--ink); }
.tabbtn.is-active::after { background: var(--accent); }

/* --- Sub-view segments (pills under group nav) --- */
.subnavbar { background: var(--bg); border-bottom: 1px solid var(--hair); }
.subnav {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 12px 0 0;
}
.seg {
  font-weight: 600;
  font-size: 12.5px;
  color: var(--muted);
  border: 1px solid var(--hair-strong);
  background: transparent;
  border-radius: 999px;
  padding: 6px 16px;
  transition: all .12s ease;
}
.seg:hover { background: var(--bg-card); color: var(--ink); }
.seg.is-active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* --- Mobile bottom bar --- */
.bottombar {
  display: none;
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 40;
  background: color-mix(in oklab, var(--bg) 92%, #fff);
  border-top: 1px solid var(--hair);
  padding: 8px 6px calc(10px + env(safe-area-inset-bottom));
  justify-content: space-around;
  backdrop-filter: blur(10px);
}
.bottombar button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
  min-width: 56px;
  padding: 2px 4px;
}
.bottombar button svg { opacity: 0.55; }
.bottombar button.is-active { color: var(--accent); font-weight: 700; }
.bottombar button.is-active svg { opacity: 1; }
.bottombar .bdot { width: 4px; height: 4px; border-radius: 2px; background: var(--accent); }
@media (max-width: 720px) {
  .bottombar { display: flex; }
  .tabstrip { display: none; }
  body { overflow-x: hidden; }
  /* tables scroll horizontally instead of clipping; capped height keeps headers sticky */
  table.fbm { display: block; overflow: auto; -webkit-overflow-scrolling: touch; max-height: 72vh; }
  .fbm th, .fbm td { padding: 4px 6px; font-size: 11.5px; }
  .fbm th { font-size: 8.5px; letter-spacing: 0.06em; }
  .fbm td.num, .fbm th.num { font-size: 11px; }
  .fbm .team-cell { min-width: 120px; gap: 6px; }
  .scrollx { max-height: 72vh; }
  /* H2H hero stacks */
  .h2h-hero { grid-template-columns: 1fr !important; gap: 14px !important; }
  body { padding-bottom: 78px; }
}

/* --- Header bar --- */
.head {
  background: var(--bg);
  border-bottom: 1px solid var(--hair);
}
.head-inner { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; gap: 16px; }
.wordmark {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: -0.02em;
  font-size: 18px;
}
.wordmark .dot {
  width: 12px; height: 12px;
  background: var(--accent);
  border-radius: 3px;
}

/* --- Inputs / select --- */
.field {
  display: inline-flex;
  align-items: center;
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--hair-strong);
  background: var(--bg-card);
  border-radius: 10px;
  font-weight: 600;
  font-size: 13px;
  color: var(--ink);
}
select.field {
  appearance: none;
  padding-right: 32px;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
  background-position: calc(100% - 16px) 16px, calc(100% - 11px) 16px;
  background-size: 5px 5px;
  background-repeat: no-repeat;
}
.field:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

/* --- Large-screen density (≥1024px). Mobile (<1024px) is untouched. --- */
.desktop-only { display: none; }
/* Tracker SELECT TEAMS: collapsed one-row summary is desktop-only; the full
   picker always shows on mobile and is gated behind "+ Add" on desktop.
   NB: these carry NO `flex` utility class on purpose — `.flex{display:flex}`
   is declared later in the sheet and would override the desktop toggles. */
.tracker-teams-collapsed { display: none; }
.tracker-teams-full { display: flex; }
.tab-info {
  margin-left: auto;
  flex: 0 0 auto;
  align-self: center;
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1.5px solid var(--hair-strong);
  background: transparent;
  color: var(--muted);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.tab-info-h { margin: 12px 0 2px; color: var(--ink); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.tab-info-p { margin: 0 0 8px; }
.tab-info-body > .tab-info-p:first-child, .tab-info-body > .tab-info-h:first-child { margin-top: 0; }
.tab-info-body > .tab-info-p:last-child { margin-bottom: 0; }
.tab-info:hover { color: var(--ink); border-color: var(--ink-soft); }
.tab-info.is-active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab-info-body { padding: 10px 0 12px; color: var(--muted); font-size: 13px; line-height: 1.5; max-width: 76ch; }
@media (min-width: 1024px) {
  .desktop-only { display: inline-flex; }
  .tab-info-body { display: block; }
  /* liga = selección de sesión: dropdown en la barra superior, fila de pills fuera */
  .lg-pills-row { display: none; }
  .lg-select { min-width: 130px; }
  /* cabecera y filas de navegación compactas */
  .head-inner { padding: 12px 0; }
  .tabbtn { padding: 11px 12px 9px; }
  .subnav { padding: 8px 0 !important; }
  /* tabs de categoría + sub-tabs de la categoría activa en una sola fila física */
  .tabstrip-sub {
    align-items: center;
    gap: 6px;
    margin-left: 14px;
    padding-left: 14px;
    border-left: 1px solid var(--hair);
  }
  .tabstrip-sub .seg { padding: 5px 13px; font-size: 12px; }
  /* la barra de sub-tabs propia desaparece: sus pills viven ya en la fila de tabs */
  .subnavbar { display: none; }
  /* Tracker SELECT TEAMS colapsado a una fila: chips seleccionados + «+ Add» */
  .tracker-teams-collapsed { display: flex; align-items: center; flex-wrap: wrap; }
  .tracker-teams-full { display: none; }
  .tracker-teams-full.is-open { display: flex; }
  /* §1: el bloque de título de página (eyebrow + H1/H2 + About) desaparece en
     desktop — el contexto ya lo da la navegación. Los controles que compartían
     fila con el título (selectores, presets) permanecen. */
  .sh-title { display: none; }
  .section-head { margin: 4px 0 12px; }
  /* NB: el colapso del margen en vistas "title-only" (section-head sin control
     hermano visible) queda para el encaje visual §2. No sirve ":empty": .sh-title
     sigue en el DOM (display:none, no eliminado), así que el nodo cuenta como hijo
     y ":empty" nunca dispararía — se retira para no dejar intención engañosa. */
  /* "About this tab" bajo demanda: se oculta el toggle in-view, va al ⓘ de la fila de tabs */
  .abouttab { display: none; }
  /* §2: gráficos responsivos al viewport. Cada wrapper lleva su máximo razonable
     en --chart-h; en desktop la altura pasa a min(máximo, altura-disponible) para
     que el aterrizaje quepa sin scroll vertical. Override del height inline (que
     sigue siendo el valor fijo en móvil, <1024px, intacto). */
  .chartbox {
    height: min(var(--chart-h, 320px), calc(100dvh - 210px)) !important;
    min-height: 180px;
  }
  /* §2 Team/Home: el aterrizaje arranca arriba y las tarjetas caben — billboard
     compacto (menos padding, H1 acotado) para no consumir el viewport. */
  .billboard { padding: 22px 26px; gap: 22px; }
  .billboard h1 { font-size: clamp(30px, 3.4vw, 44px); margin-top: 10px; }
}

/* --- Crest --- */
.crest {
  width: 22px; height: 22px;
  object-fit: contain;
  flex: 0 0 22px;
}
.crest.lg { width: 40px; height: 40px; flex-basis: 40px; }
.crest.xl { width: 64px; height: 64px; flex-basis: 64px; }
.crest.sm { width: 16px; height: 16px; flex-basis: 16px; }

/* --- Skewed accent bar (broadcast-y stripe accent) --- */
.stripe {
  display: inline-block;
  width: 3px;
  height: 1em;
  background: var(--accent);
  vertical-align: -2px;
  margin-right: 8px;
}

/* --- Sparkline-ish container --- */
.spark { width: 100%; height: 28px; }

/* --- Section heading --- */
.section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  margin: 28px 0 14px;
  gap: 12px;
  flex-wrap: wrap;
}
.section-head h2 { font-size: clamp(22px, 2.4vw, 28px); }

/* --- Hero number block --- */
.hero-num {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 16px 18px;
  align-items: baseline;
}

/* --- Zone bar (UCL / UEL / Conf / Mid / Rel) --- */
.zone-bar {
  display: flex;
  height: 6px;
  border-radius: 3px;
  overflow: hidden;
  background: var(--bg-sunken);
}
.zone-bar > span { display: block; height: 100%; }
.zb-ucl   { background: #1E40AF; }
.zb-uel   { background: #D14F33; }
.zb-conf  { background: #0E8A55; }
.zb-mid   { background: var(--hair-strong); }
.zb-rel   { background: #1B1B1B; }

[data-theme="dark"] .zb-mid { background: rgba(255,255,255,0.18); }
[data-theme="dark"] .zb-rel { background: #C0392B; }

/* --- Match cell (compact result block) --- */
.matchcell {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--hair);
  border-radius: 10px;
  background: var(--bg-card);
}
.matchcell .home, .matchcell .away { display: flex; align-items: center; gap: 8px; min-width: 0; }
.matchcell .away { justify-content: flex-end; }
.matchcell .score { font-family: var(--font-display); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }

/* --- Recharts overrides --- */
.recharts-cartesian-axis-line { stroke: var(--hair); }
.recharts-cartesian-axis-tick-line { stroke: var(--hair); }
.recharts-cartesian-axis-tick-value { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
.recharts-tooltip-wrapper .recharts-default-tooltip {
  background: var(--bg-card) !important;
  border: 1px solid var(--hair-strong) !important;
  border-radius: 10px !important;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08) !important;
  font-family: var(--font-ui) !important;
}
.recharts-tooltip-label { color: var(--ink) !important; font-weight: 700 !important; }

/* --- Hero billboard --- */
.billboard {
  background: var(--ink);
  color: var(--bg);
  border-radius: 18px;
  padding: 32px;
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 28px;
  align-items: center;
  overflow: hidden;
  position: relative;
}
.billboard .accent-strip {
  position: absolute;
  inset: 0 auto 0 0;
  width: 6px;
  background: var(--accent);
}
.billboard .meta {
  display: flex; gap: 14px; align-items: center;
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(255,255,255,0.7);
}
.billboard h1 {

<script>
/* === data.js === */
/* Football Beyond Money — data layer.
   Loads the REAL production data.json at runtime (no synthesis).
   data.json shape (authoritative, read from the deployed contract):
     model[lg]           = { beta, theta1, theta2 }              ordered-logit params
     seasons[lg][sn][tm] = { a[], e[], m[], gd, w, r[] }
        m[i] = [opp, isHome(1/0), ptsActual, ptsExpected]
        r[i] = [opp, isHome(1/0), pW, pD, pL, gw, "YYYY-MM-DD"]   upcoming
     bands[lg][tm]       = { p10[], p50[], p90[] }                updated forecast (cur season)
     pre[lg][tm]         = { p10[], p50[], p90[] }                budget forecast (cur season)
     pos[lg][sn]         = { pre:{tm:{1st,ucl,uel,conf,mid,rel,p50}}, cur:{...}, hist:[{probs:{tm:{p50}}}] }
     cumulative[lg][tm]  = overperformance record across seasons
     narratives[lg][tm]  = [en, es] bilingual outlook
     meta.wage_status[lg][sn] = "stale" | ...
   Leagues/zones are app constants (not in data.json). */

const LEAGUES = {
  ll: { name: "La Liga",        cur: "€", flag: "🇪🇸", def: "Barcelona",    n: 20, ucl: 4, uel: 2, ucol: 1, rel: 3, country: "ESP" },
  pl: { name: "Premier League", cur: "£", flag: "🇬🇧", def: "Liverpool",    n: 20, ucl: 4, uel: 2, ucol: 1, rel: 3, country: "ENG" },
  sa: { name: "Serie A",        cur: "€", flag: "🇮🇹", def: "Inter Milan",  n: 20, ucl: 4, uel: 2, ucol: 1, rel: 3, country: "ITA" },
  bl: { name: "Bundesliga",     cur: "€", flag: "🇩🇪", def: "Bayern Munich",n: 18, ucl: 4, uel: 2, ucol: 1, rel: 3, country: "GER" },
  l1: { name: "Ligue 1",        cur: "€", flag: "🇫🇷", def: "PSG",          n: 18, ucl: 4, uel: 1, ucol: 1, rel: 3, country: "FRA" },
  ed: { name: "Eredivisie",     cur: "€", flag: "🇳🇱", def: "Ajax",         n: 18, ucl: 2, uel: 1, ucol: 1, rel: 3, country: "NED" }
};
const LG_ORDER = ["pl", "ll", "sa", "bl", "l1", "ed"];

/* Position-zone boundaries per league (1-indexed, inclusive) — from the original ZONES constant.
   These drive the Tracker position-view background bands; note the 18-team leagues differ. */
const ZONES = {
  pl: { champion: [1, 1], ucl: [1, 4], uel: [5, 5], conf: [6, 6], rel: [18, 20] },
  ll: { champion: [1, 1], ucl: [1, 4], uel: [5, 5], conf: [6, 6], rel: [18, 20] },
  sa: { champion: [1, 1], ucl: [1, 4], uel: [5, 5], conf: [6, 6], rel: [18, 20] },
  bl: { champion: [1, 1], ucl: [1, 4], uel: [5, 6], conf: [7, 7], rel: [16, 18] },
  l1: { champion: [1, 1], ucl: [1, 4], uel: [5, 5], conf: [6, 6], rel: [16, 18] },
  ed: { champion: [1, 1], ucl: [1, 2], uel: [3, 3], conf: [4, 4], rel: [16, 18] }

function sigmoid(z) { return 1 / (1 + Math.exp(-z)); }

  if (!mod || !(wHome > 0) || !(wAway > 0)) return [0.4, 0.26, 0.34];
  const x = Math.log2(wAway / wHome);
  const pH = 1 - sigmoid(mod.theta2 + mod.beta * x);
  const pD = sigmoid(mod.theta2 + mod.beta * x) - sigmoid(mod.theta1 + mod.beta * x);
  const pA = 1 - pH - pD;
  return [pH, pD, pA];
}

const DATA_URLS = [
  "data.json",
  "https://footballbeyondmoney.uk/data.json",
  "https://raw.githubusercontent.com/talfarouriarte-cloud/what-money-cant-buy/develop/data.json"
];

async function fetchFirst(urls, asJson) {
  let lastErr;
  for (const u of urls) {
    try {
      const res = await fetch(u, { mode: "cors" });
      if (!res.ok) throw new Error(u + " → " + res.status);
      return asJson ? await res.json() : res;
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

async function buildDataset() {
  const [D, crests, i18n] = await Promise.all([
    fetchFirst(DATA_URLS, true),
    fetch("crests.json").then(r => r.json()).catch(() => ({})),
    fetch("i18n.json").then(r => r.json()).catch(() => ({}))

  // currentSeason = latest season key present across leagues
  let currentSeason = "";
  Object.values(D.seasons || {}).forEach(lgSeasons => {
    Object.keys(lgSeasons).forEach(sn => { if (sn > currentSeason) currentSeason = sn; });
  });

  return {
    LEAGUES,
    LG_ORDER,
    ZONES,
    crests,
    model: D.model || {},
    seasons: D.seasons || {},
    bands: D.bands || {},
    pre: D.pre || {},
    pos: D.pos || {},
    cumulative: D.cumulative || {},
    narratives: D.narratives || {},
    meta: D.meta || {},
    currentSeason
  };
}

/* Expose */
window.FBM_LEAGUES = LEAGUES;
window.FBM_LG_ORDER = LG_ORDER;
window.FBM_ZONES = ZONES;
window.FBM_probs = probsFromModel;
window.FBM_buildDataset = buildDataset;

/* ---- i18n: [en, es] strings, lang from hash (#lang=) or localStorage, default en ---- */
function fbmLangFromHash() {
  const m = location.hash.match(/lang=(en|es)/);
  if (m) return m[1];
  try { return localStorage.getItem("fbm_lang") || "en"; } catch (e) { return "en"; }
}
window._lang = fbmLangFromHash();
window._li = () => (window._lang === "es" ? 1 : 0);
window._t = (key) => {
  const e = window.FBM_I18N && window.FBM_I18N[key];
  if (!e) return key;

window._tf = (key, vars) => {
  let s = window._t(key);
  if (vars) Object.keys(vars).forEach(k => { s = s.replace(new RegExp("\\{" + k + "\\}", "g"), vars[k]); });
  return s;
};
window.FBM_setLang = (lang) => {
  window._lang = lang;
  try { localStorage.setItem("fbm_lang", lang); } catch (e) {}
  const base = location.hash.replace(/[#&]?lang=(en|es)/, "").replace(/^#?/, "");
  location.hash = (base ? base + "&" : "tab=home&") + "lang=" + lang;
  location.reload();
};

</script>
